# Use system/host Ollama instead of Docker service
# Usage: docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up -d
#
# Use this if you're running Ollama natively on your host machine.
# The Engram container will connect to host Ollama via Docker's host.docker.internal.
#
# Prerequisites:
#   1. Ollama running on host: ollama serve
#   2. Model pulled on host: ollama pull nomic-embed-text
#   3. Then start Engram: docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up -d

services:
  engram:
    environment:
      - OLLAMA_URL=http://open-webui:8080/ollama
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      open-webui:
        condition: service_started
    # Route through Open-WebUI instead of Ollama directly

  open-webui:
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      ollama:
        condition: service_started
      postgres:
        condition: service_healthy
    # Point Open-WebUI at host Ollama instead of Docker Ollama
    # Override ollama dependency to service_started (no-op container has no healthcheck)

  # Replace Docker Ollama with a no-op container that exits immediately.
  # This satisfies depends_on from open-webui without running a real Ollama.
  # Open-WebUI connects to host Ollama via host.docker.internal instead.
  ollama:
    image: busybox:latest
    entrypoint: ["true"]
    restart: "no"

  ollama-init:
    profiles: ["disabled"]
