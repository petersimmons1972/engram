# NVIDIA GPU support for Ollama
# Usage: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# Requires:
# - NVIDIA Container Toolkit installed
# - Docker daemon configured with nvidia runtime
# - NVIDIA GPU with CUDA compute capability 3.5+

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
