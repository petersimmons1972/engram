# AMD GPU support for Ollama using ROCm
# Usage: docker compose -f docker-compose.yml -f docker-compose.amd.yml up -d
#
# Requires:
# - AMD GPU (RDNA or CDNA architecture)
# - ROCm runtime installed on host
# - Docker with proper device access

services:
  ollama:
    image: ollama/ollama:rocm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
