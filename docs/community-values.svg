<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%">

  <!-- Background -->
  <rect width="960" height="280" fill="#080c09"/>

  <!-- Left accent bar -->
  <rect width="5" height="280" fill="#00ff88"/>

  <!-- Title bar -->
  <line x1="24" y1="49" x2="936" y2="49" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
  <text x="480" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#00ff88" text-anchor="middle" letter-spacing="4">HOW WE WORK TOGETHER</text>

  <!-- Card 1: Be Kind -->
  <rect x="36"  y="66" width="200" height="186" fill="#0d1510" rx="2"/>
  <rect x="36"  y="66" width="200" height="50"  fill="#0a1a0d" rx="2"/>
  <rect x="36"  y="98" width="200" height="18"  fill="#0a1a0d"/>
  <line x1="36" y1="66" x2="36"  y2="252" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
  <!-- Heart (geometric) -->
  <path d="M136,84 C136,80 131,76 127,80 C123,76 118,80 118,84 C118,90 127,98 127,98 C127,98 136,90 136,84 Z" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.7"/>
  <text x="136" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="3">BE KIND</text>
  <text x="136" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">Empathy first.</text>
  <text x="136" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">Every contributor</text>
  <text x="136" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">was a beginner</text>
  <text x="136" y="196" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">once. Patience</text>
  <text x="136" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">is not optional.</text>

  <!-- Card 2: Be Direct -->
  <rect x="256" y="66" width="200" height="186" fill="#0d1510" rx="2"/>
  <rect x="256" y="66" width="200" height="50"  fill="#0a1a0d" rx="2"/>
  <rect x="256" y="98" width="200" height="18"  fill="#0a1a0d"/>
  <line x1="256" y1="66" x2="256" y2="252" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  <!-- Arrow (geometric) -->
  <line x1="346" y1="82" x2="360" y2="92" stroke="#00ff88" stroke-width="1.5" opacity="0.7"/>
  <line x1="346" y1="102" x2="360" y2="92" stroke="#00ff88" stroke-width="1.5" opacity="0.7"/>
  <line x1="322" y1="92" x2="360" y2="92" stroke="#00ff88" stroke-width="1.5" opacity="0.7"/>
  <text x="356" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="3">BE DIRECT</text>
  <text x="356" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">Say what you mean.</text>
  <text x="356" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">Vague feedback</text>
  <text x="356" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">helps no one. Be</text>
  <text x="356" y="196" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">specific about</text>
  <text x="356" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">what and why.</text>

  <!-- Card 3: Assume Good Intent -->
  <rect x="476" y="66" width="200" height="186" fill="#0d1510" rx="2"/>
  <rect x="476" y="66" width="200" height="50"  fill="#0a1a0d" rx="2"/>
  <rect x="476" y="98" width="200" height="18"  fill="#0a1a0d"/>
  <line x1="476" y1="66" x2="476" y2="252" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  <!-- Star (geometric) -->
  <polygon points="576,76 578,86 588,86 580,92 583,102 576,96 569,102 572,92 564,86 574,86" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.7"/>
  <text x="576" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="2">ASSUME GOOD INTENT</text>
  <text x="576" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">People rarely mean</text>
  <text x="576" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">harm. When in</text>
  <text x="576" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">doubt, ask a</text>
  <text x="576" y="196" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">clarifying question</text>
  <text x="576" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">before escalating.</text>

  <!-- Card 4: Code Not People -->
  <rect x="696" y="66" width="228" height="186" fill="#0d1510" rx="2"/>
  <rect x="696" y="66" width="228" height="50"  fill="#0a1a0d" rx="2"/>
  <rect x="696" y="98" width="228" height="18"  fill="#0a1a0d"/>
  <line x1="696" y1="66" x2="696" y2="252" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  <!-- Brackets (geometric) -->
  <text x="810" y="99" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#00ff88" text-anchor="middle" opacity="0.6">{  }</text>
  <text x="810" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="2">CRITIQUE CODE, NOT PEOPLE</text>
  <text x="810" y="142" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">"This function could"</text>
  <text x="810" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">is always better than</text>
  <text x="810" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">"you should have."</text>
  <text x="810" y="196" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">Review the work,</text>
  <text x="810" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">not the person.</text>
</svg>
