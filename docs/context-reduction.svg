<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c09"/>
      <stop offset="100%" style="stop-color:#0a0f0c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ff88" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="320" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect width="5" height="320" fill="#00ff88"/>

  <!-- Concentric circles — right side motif -->
  <circle cx="900" cy="160" r="90" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.10"/>
  <circle cx="900" cy="160" r="68" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.18"/>
  <circle cx="900" cy="160" r="46" fill="none" stroke="#00ff88" stroke-width="0.7" opacity="0.28"/>
  <circle cx="900" cy="160" r="24" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.40"/>
  <circle cx="900" cy="160" r="8"  fill="#00ff88" opacity="0.22"/>
  <circle cx="900" cy="160" r="3"  fill="#00ff88" opacity="0.85"/>

  <!-- Top rule -->
  <line x1="24" y1="28" x2="800" y2="28" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <!-- Title -->
  <text x="24" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00ff88" font-weight="700" letter-spacing="4">CONTEXT WINDOW EFFICIENCY</text>

  <!-- Subtitle -->
  <text x="24" y="63" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#999999" font-style="italic">Bytes served to the LLM per memory recall</text>

  <!-- Horizontal rule below subtitle -->
  <line x1="24" y1="72" x2="800" y2="72" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- Grid lines (vertical) -->
  <line x1="185" y1="82" x2="185" y2="218" stroke="#1a2a1a" stroke-width="0.5"/>
  <line x1="375" y1="82" x2="375" y2="218" stroke="#1a2a1a" stroke-width="0.5"/>
  <line x1="565" y1="82" x2="565" y2="218" stroke="#1a2a1a" stroke-width="0.5"/>
  <line x1="755" y1="82" x2="755" y2="218" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- Bar 1: FULL — 760px wide -->
  <!-- Left label -->
  <text x="24" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" letter-spacing="1.5">FULL</text>
  <!-- Bar starts at x=120 -->
  <rect x="120" y="88" width="760" height="30" fill="#00ff88" opacity="0.15" stroke="#00ff88" stroke-width="0.5"/>
  <!-- Value label inside/right -->
  <text x="772" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#cccccc" letter-spacing="0.8">~8,000 chars avg</text>

  <!-- Bar 2: CHUNK — 190px wide (scaled) -->
  <text x="24" y="153" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" letter-spacing="1.5">CHUNK</text>
  <rect x="120" y="133" width="190" height="30" fill="#00ff88" opacity="0.40" stroke="#00ff88" stroke-width="0.5"/>
  <text x="318" y="153" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#cccccc" letter-spacing="0.8">~200 chars</text>

  <!-- Bar 3: SUMMARY — 114px wide (scaled) -->
  <text x="24" y="198" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" letter-spacing="1.5">SUMMARY</text>
  <rect x="120" y="178" width="114" height="30" fill="#00ff88" opacity="0.85" stroke="#00ff88" stroke-width="0.5"/>
  <text x="242" y="198" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#cccccc" letter-spacing="0.8">~150 chars · default</text>

  <!-- Horizontal rule -->
  <line x1="24" y1="224" x2="800" y2="224" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- Big reduction call-out -->
  <text x="24" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" fill="#00ff88" font-weight="900">13×</text>
  <text x="120" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#00ff88" font-weight="700" letter-spacing="1">reduction at scale</text>
  <text x="24" y="282" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#999999" font-style="italic">vs full-content default</text>

  <!-- Bottom rule -->
  <line x1="24" y1="294" x2="600" y2="294" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <!-- Badge pills -->
  <rect x="24"  y="300" width="190" height="15" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="24"  y="300" width="190" height="15" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="119" y="311" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">BM25 continues during migration</text>

  <rect x="222" y="300" width="178" height="15" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="222" y="300" width="178" height="15" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="311" y="311" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">Summaries generated async</text>

  <rect x="408" y="300" width="210" height="15" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="408" y="300" width="210" height="15" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="513" y="311" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">Falls back to chunk if unsummarized</text>
</svg>
