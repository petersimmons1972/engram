<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c09"/>
      <stop offset="100%" style="stop-color:#0a0f0c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ff88" opacity="0.7"/>
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ff88" opacity="0.35"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect width="5" height="420" fill="#00ff88"/>

  <!-- Concentric circles — right side motif -->
  <circle cx="920" cy="210" r="80"  fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.08"/>
  <circle cx="920" cy="210" r="58"  fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.14"/>
  <circle cx="920" cy="210" r="38"  fill="none" stroke="#00ff88" stroke-width="0.7" opacity="0.22"/>
  <circle cx="920" cy="210" r="20"  fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.35"/>
  <circle cx="920" cy="210" r="7"   fill="#00ff88" opacity="0.20"/>
  <circle cx="920" cy="210" r="2.5" fill="#00ff88" opacity="0.85"/>

  <!-- Top rule -->
  <line x1="24" y1="28" x2="870" y2="28" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <!-- Title -->
  <text x="24" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00ff88" font-weight="700" letter-spacing="4">ENGRAM — SYSTEM ARCHITECTURE</text>
  <text x="24" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#999999" font-style="italic">Left-to-right data flow · PostgreSQL only · Background daemon threads</text>

  <!-- Horizontal rule -->
  <line x1="24" y1="70" x2="870" y2="70" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 1: MCP Client → Engram Server → Search Engine        -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- [MCP Client] box -->
  <rect x="24" y="88" width="140" height="60" rx="2" fill="#0d1a0d" stroke="#00ff88" stroke-width="0.8"/>
  <text x="94" y="113" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1">MCP CLIENT</text>
  <text x="94" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">Claude · Cursor · VS Code</text>

  <!-- Arrow MCP → Engram -->
  <line x1="164" y1="118" x2="200" y2="118" stroke="#00ff88" stroke-width="1" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="182" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#999999" text-anchor="middle" letter-spacing="0.5">MCP/STDIO</text>

  <!-- [Engram Server] box — wider, contains daemon threads -->
  <rect x="204" y="78" width="290" height="160" rx="2" fill="#0d1a0d" stroke="#00ff88" stroke-width="1.2"/>
  <text x="349" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1.5">ENGRAM SERVER</text>
  <line x1="214" y1="106" x2="484" y2="106" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <!-- Tools row inside Engram Server -->
  <text x="219" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" letter-spacing="0.8">TOOLS:</text>
  <!-- tool pills -->
  <rect x="255" y="109" width="36" height="14" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="255" y="109" width="36" height="14" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="273" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.5">store</text>

  <rect x="297" y="109" width="38" height="14" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="297" y="109" width="38" height="14" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="316" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.5">recall</text>

  <rect x="341" y="109" width="44" height="14" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="341" y="109" width="44" height="14" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="363" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.5">connect</text>

  <rect x="391" y="109" width="32" height="14" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="391" y="109" width="32" height="14" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="407" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.5">list</text>

  <rect x="429" y="109" width="46" height="14" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="429" y="109" width="46" height="14" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="452" y="120" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.5">correct</text>

  <!-- Separator inside Engram -->
  <line x1="214" y1="130" x2="484" y2="130" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- Background daemons section header -->
  <text x="219" y="145" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" letter-spacing="0.8">DAEMON THREADS:</text>

  <!-- BackgroundSummarizer box -->
  <rect x="214" y="152" width="127" height="36" rx="2" fill="#00ff88" opacity="0.05" stroke="#00ff88" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="278" y="167" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="0.8">BackgroundSummarizer</text>
  <text x="278" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" text-anchor="middle">generates summaries async</text>

  <!-- BackgroundReembedder box -->
  <rect x="350" y="152" width="128" height="36" rx="2" fill="#00ff88" opacity="0.05" stroke="#00ff88" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="414" y="167" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="0.8">BackgroundReembedder</text>
  <text x="414" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" text-anchor="middle">re-embeds updated chunks</text>

  <!-- Engram → Search Engine arrow -->
  <line x1="494" y1="118" x2="538" y2="118" stroke="#00ff88" stroke-width="1" marker-end="url(#arrow)" opacity="0.7"/>
  <text x="516" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#999999" text-anchor="middle" letter-spacing="0.5">query</text>

  <!-- [Search Engine] box -->
  <rect x="542" y="88" width="166" height="60" rx="2" fill="#0d1a0d" stroke="#00ff88" stroke-width="0.8"/>
  <text x="625" y="112" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1">SEARCH ENGINE</text>
  <text x="625" y="128" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">BM25 · Vector · Recency</text>
  <text x="625" y="140" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#999999" text-anchor="middle">composite × importance</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 2: Scoring pipeline below Search Engine               -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Vertical arrow down from Search Engine to scoring -->
  <line x1="625" y1="148" x2="625" y2="178" stroke="#00ff88" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Scoring pipeline bar -->
  <rect x="440" y="182" width="370" height="38" rx="2" fill="#0d1a0d" stroke="#00ff88" stroke-width="0.6"/>
  <text x="455" y="197" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" letter-spacing="0.8">SCORING PIPELINE</text>
  <text x="455" y="213" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" letter-spacing="0.5">BM25(0.35) + Vector(0.50) + Recency(0.15)  →  composite  ×  importance  →  ranked</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Vertical arrow: Engram + daemons → PostgreSQL            -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Arrow down from bottom of Engram box to PostgreSQL -->
  <line x1="349" y1="238" x2="349" y2="268" stroke="#00ff88" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- [PostgreSQL] box -->
  <rect x="204" y="272" width="290" height="56" rx="2" fill="#0d1a0d" stroke="#00ff88" stroke-width="0.8"/>
  <text x="349" y="295" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="1.5">POSTGRESQL</text>
  <text x="349" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">pgvector · tsvector FTS · graph edges</text>

  <!-- Arrow: Search Engine down to PostgreSQL -->
  <line x1="625" y1="220" x2="625" y2="260" stroke="#00ff88" stroke-width="0.8" marker-end="url(#arrow-dim)" opacity="0.45" stroke-dasharray="4,2"/>
  <line x1="625" y1="260" x2="500" y2="260" stroke="#00ff88" stroke-width="0.8" opacity="0.35" stroke-dasharray="4,2"/>
  <line x1="500" y1="260" x2="500" y2="272" stroke="#00ff88" stroke-width="0.8" marker-end="url(#arrow-dim)" opacity="0.35" stroke-dasharray="4,2"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 3: Sub-stores inside PostgreSQL                       -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <!-- Arrow down from PostgreSQL -->
  <line x1="349" y1="328" x2="349" y2="354" stroke="#00ff88" stroke-width="0.8" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Three sub-store boxes -->
  <!-- FTS tsvector -->
  <rect x="140" y="358" width="148" height="40" rx="2" fill="#00ff88" opacity="0.06" stroke="#00ff88" stroke-width="0.5"/>
  <text x="214" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="1">FTS (tsvector)</text>
  <text x="214" y="389" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" text-anchor="middle">full-text keyword search</text>

  <!-- Fan-out lines from PostgreSQL bottom -->
  <line x1="349" y1="354" x2="214" y2="358" stroke="#00ff88" stroke-width="0.6" opacity="0.35"/>
  <line x1="349" y1="354" x2="349" y2="358" stroke="#00ff88" stroke-width="0.6" opacity="0.35"/>
  <line x1="349" y1="354" x2="490" y2="358" stroke="#00ff88" stroke-width="0.6" opacity="0.35"/>

  <!-- Chunks + Embeddings -->
  <rect x="296" y="358" width="106" height="40" rx="2" fill="#00ff88" opacity="0.06" stroke="#00ff88" stroke-width="0.5"/>
  <text x="349" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="1">CHUNKS</text>
  <text x="349" y="389" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" text-anchor="middle">+ embeddings (pgvector)</text>

  <!-- Graph -->
  <rect x="410" y="358" width="148" height="40" rx="2" fill="#00ff88" opacity="0.06" stroke="#00ff88" stroke-width="0.5"/>
  <text x="484" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="1">GRAPH</text>
  <text x="484" y="389" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#999999" text-anchor="middle">memory edge relationships</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Detail resolution panel (right column)                    -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <rect x="740" y="88" width="196" height="154" rx="2" fill="#0d1a0d" stroke="#00ff88" stroke-width="0.8"/>
  <text x="838" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="2">DETAIL RESOLUTION</text>
  <line x1="752" y1="114" x2="924" y2="114" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <!-- summary row -->
  <text x="752" y="132" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#00ff88" font-weight="700" letter-spacing="0.8">SUMMARY</text>
  <rect x="820" y="122" width="106" height="14" rx="1" fill="#1a2a1a"/>
  <rect x="820" y="122" width="106" height="14" rx="1" fill="#00ff88" opacity="0.85"/>
  <text x="930" y="133" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#cccccc">150c</text>
  <text x="752" y="144" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#999999" font-style="italic">default</text>

  <!-- chunk row -->
  <text x="752" y="165" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#00ff88" font-weight="700" letter-spacing="0.8">CHUNK</text>
  <rect x="820" y="155" width="106" height="14" rx="1" fill="#1a2a1a"/>
  <rect x="820" y="155" width="106" height="14" rx="1" fill="#00ff88" opacity="0.45"/>
  <text x="930" y="166" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#cccccc">200c</text>
  <text x="752" y="177" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#999999" font-style="italic">if unsummarized</text>

  <!-- full row -->
  <text x="752" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#00ff88" font-weight="700" letter-spacing="0.8">FULL</text>
  <rect x="820" y="190" width="106" height="14" rx="1" fill="#1a2a1a"/>
  <rect x="820" y="190" width="106" height="14" rx="1" fill="#00ff88" opacity="0.15"/>
  <text x="930" y="201" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#cccccc">50K</text>
  <text x="752" y="212" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#999999" font-style="italic">explicit only</text>

  <!-- Resolution cascade label -->
  <text x="752" y="232" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#999999" letter-spacing="0.5">Cascade: summary → chunk → full</text>

  <!-- Divider -->
  <line x1="24" y1="408" x2="870" y2="408" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
</svg>
