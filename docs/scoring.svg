<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c09"/>
      <stop offset="100%" style="stop-color:#0a0f0c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect width="5" height="360" fill="#00ff88"/>

  <!-- Top rule -->
  <line x1="24" y1="28" x2="936" y2="28" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <!-- Title -->
  <text x="24" y="46" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00ff88" font-weight="700" letter-spacing="4">RECALL SCORING &amp; DETAIL TIERS</text>
  <text x="24" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#999999" font-style="italic">Three signals · importance multiplier · configurable detail level</text>

  <!-- Horizontal rule -->
  <line x1="24" y1="70" x2="936" y2="70" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- Centre divider -->
  <line x1="490" y1="78" x2="490" y2="320" stroke="#1a2a1a" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PANEL 1: Scoring weights (left)                           -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <text x="24" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#999999" letter-spacing="2">SIGNAL WEIGHTS</text>

  <!-- Grid lines (horizontal) for bar chart -->
  <line x1="24" y1="100" x2="468" y2="100" stroke="#1a2a1a" stroke-width="0.5"/>
  <line x1="24" y1="145" x2="468" y2="145" stroke="#1a2a1a" stroke-width="0.5"/>
  <line x1="24" y1="190" x2="468" y2="190" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- Bar chart — three vertical bars side by side -->
  <!-- VECTOR 50% — tallest -->
  <!-- Bar height: 50% of 200px range = 100px; top y = 200 - 100 = 100; bar goes 100→200 -->
  <rect x="80"  y="100" width="90" height="100" fill="#00ff88" opacity="0.85"/>
  <text x="125" y="215"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="0.8">VECTOR</text>
  <text x="125" y="228"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00ff88" font-weight="900" text-anchor="middle">0.50</text>
  <text x="125" y="92"   font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#cccccc" text-anchor="middle">50%</text>

  <!-- BM25 35% -->
  <!-- bar height: 70px; top y = 200 - 70 = 130 -->
  <rect x="200" y="130" width="90" height="70" fill="#00ff88" opacity="0.55"/>
  <text x="245" y="215"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="0.8">BM25</text>
  <text x="245" y="228"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00ff88" font-weight="900" text-anchor="middle">0.35</text>
  <text x="245" y="122"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#cccccc" text-anchor="middle">35%</text>

  <!-- RECENCY 15% -->
  <!-- bar height: 30px; top y = 200 - 30 = 170 -->
  <rect x="320" y="170" width="90" height="30" fill="#00ff88" opacity="0.30"/>
  <text x="365" y="215"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00ff88" font-weight="700" text-anchor="middle" letter-spacing="0.8">RECENCY</text>
  <text x="365" y="228"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00ff88" font-weight="900" text-anchor="middle">0.15</text>
  <text x="365" y="162"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#cccccc" text-anchor="middle">15%</text>

  <!-- Baseline -->
  <line x1="50" y1="200" x2="455" y2="200" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>

  <!-- Formula below bars -->
  <line x1="24" y1="242" x2="468" y2="242" stroke="#1a2a1a" stroke-width="0.5"/>
  <text x="24" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#999999" letter-spacing="0.8">FORMULA</text>
  <text x="24" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#cccccc" font-weight="700">composite</text>
  <text x="115" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#999999">= (vec × 0.50) + (bm25 × 0.35) + (rec × 0.15)</text>
  <text x="24" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#00ff88" font-weight="900">final_score</text>
  <text x="118" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#999999">= composite × importance_mult</text>

  <!-- Importance multiplier note -->
  <line x1="24" y1="312" x2="468" y2="312" stroke="#1a2a1a" stroke-width="0.5"/>
  <text x="24" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#999999" letter-spacing="0.5">importance_mult: critical(0)=2.0× · high(1)=1.65× · medium(2)=1.30× · low(3)=0.95× · trivial(4)=0.60×</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- PANEL 2: Detail tiers (right)                             -->
  <!-- ══════════════════════════════════════════════════════════ -->

  <text x="508" y="92" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#999999" letter-spacing="2">RECALL DETAIL LEVELS</text>

  <!-- Row header rules -->
  <line x1="508" y1="100" x2="936" y2="100" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- SUMMARY row — default -->
  <text x="508" y="125" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#00ff88" font-weight="700" letter-spacing="1">SUMMARY</text>
  <!-- bar: full width = 200px at 100% -->
  <rect x="620" y="113" width="240" height="18" rx="1" fill="#1a2a1a"/>
  <rect x="620" y="113" width="180" height="18" rx="1" fill="#00ff88" opacity="0.85"/>
  <text x="864" y="126" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" fill="#cccccc">~150 chars</text>
  <text x="620" y="144" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#999999" font-style="italic">default · generated async by BackgroundSummarizer</text>
  <line x1="508" y1="152" x2="936" y2="152" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- CHUNK row -->
  <text x="508" y="177" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#00ff88" font-weight="700" letter-spacing="1">CHUNK</text>
  <rect x="620" y="165" width="240" height="18" rx="1" fill="#1a2a1a"/>
  <rect x="620" y="165" width="240" height="18" rx="1" fill="#00ff88" opacity="0.45"/>
  <text x="864" y="178" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" fill="#cccccc">~200 chars</text>
  <text x="620" y="196" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#999999" font-style="italic">fallback if unsummarized · explicit detail="chunk"</text>
  <line x1="508" y1="204" x2="936" y2="204" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- FULL row -->
  <text x="508" y="229" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#00ff88" font-weight="700" letter-spacing="1">FULL</text>
  <rect x="620" y="217" width="240" height="18" rx="1" fill="#1a2a1a"/>
  <rect x="620" y="217" width="240" height="18" rx="1" fill="#00ff88" opacity="0.15"/>
  <text x="864" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" fill="#cccccc">up to 50K chars</text>
  <text x="620" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#999999" font-style="italic">explicit detail="full" only · raw stored content</text>
  <line x1="508" y1="256" x2="936" y2="256" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- Context reduction call-out -->
  <text x="508" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#00ff88" font-weight="900">13×</text>
  <text x="580" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#00ff88" font-weight="700" letter-spacing="0.5">reduction at scale</text>
  <text x="508" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#999999" font-style="italic">SUMMARY vs FULL — same BM25 index, 13× less context</text>

  <!-- Bottom badges (right panel) -->
  <line x1="508" y1="312" x2="936" y2="312" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <rect x="508" y="318" width="130" height="15" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="508" y="318" width="130" height="15" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="573" y="329" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">BM25 always active</text>

  <rect x="646" y="318" width="136" height="15" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="646" y="318" width="136" height="15" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="714" y="329" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">Summaries generated async</text>

  <rect x="790" y="318" width="142" height="15" rx="2" fill="#00ff88" opacity="0.08"/>
  <rect x="790" y="318" width="142" height="15" rx="2" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.35"/>
  <text x="861" y="329" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#00ff88" text-anchor="middle" letter-spacing="0.8">Falls back to chunk gracefully</text>

  <!-- Bottom rule -->
  <line x1="24" y1="348" x2="936" y2="348" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
</svg>
