<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c09"/>
      <stop offset="100%" style="stop-color:#0a0f0c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00ff88" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="360" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect width="5" height="360" fill="#00ff88"/>

  <!-- Top rule -->
  <line x1="24" y1="28" x2="936" y2="28" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>

  <!-- Title -->
  <text x="480" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#00ff88" text-anchor="middle" letter-spacing="4">CONTRIBUTION FLOW — BUG TO MERGED PR</text>

  <!-- Horizontal rule -->
  <line x1="24" y1="56" x2="936" y2="56" stroke="#1a2a1a" stroke-width="0.5"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- ROW 1 — steps 1–4 (top row)                          -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Step 1: Found a bug? -->
  <rect x="24"  y="72" width="132" height="100" fill="#0d1510" rx="2"/>
  <rect x="24"  y="72" width="132" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="24"  y="100" width="132" height="12" fill="#0a1a0d"/>
  <line x1="24" y1="72" x2="24"   y2="172" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <text x="90"  y="95"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">FOUND A BUG?</text>
  <text x="90"  y="126" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Reproduce it.</text>
  <text x="90"  y="143" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Note the exact</text>
  <text x="90"  y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">failure steps.</text>

  <!-- Arrow 1→2 -->
  <line x1="156" y1="122" x2="178" y2="122" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Step 2: File GitHub Issue -->
  <rect x="182" y="72" width="140" height="100" fill="#0d1510" rx="2"/>
  <rect x="182" y="72" width="140" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="182" y="100" width="140" height="12" fill="#0a1a0d"/>
  <line x1="182" y1="72" x2="182"  y2="172" stroke="#00ff88" stroke-width="1.5" opacity="0.35"/>
  <text x="252"  y="91"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">FILE GITHUB ISSUE</text>
  <text x="252"  y="108"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"  fill="#00ff88" text-anchor="middle" letter-spacing="0.8">before writing code</text>
  <text x="252"  y="129" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Title, repro steps,</text>
  <text x="252"  y="146" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">expected behavior.</text>
  <text x="252"  y="163" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Get an issue #.</text>

  <!-- Arrow 2→3 -->
  <line x1="322" y1="122" x2="344" y2="122" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Step 3: Set up dev env -->
  <rect x="348" y="72" width="148" height="100" fill="#0d1510" rx="2"/>
  <rect x="348" y="72" width="148" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="348" y="100" width="148" height="12" fill="#0a1a0d"/>
  <line x1="348" y1="72" x2="348"  y2="172" stroke="#00ff88" stroke-width="1.5" opacity="0.35"/>
  <text x="422"  y="91"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">SET UP DEV ENV</text>
  <text x="422"  y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"  fill="#00ff88" text-anchor="middle" letter-spacing="0.8">Postgres via Docker</text>
  <text x="422"  y="129" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">docker compose up -d</text>
  <text x="422"  y="146" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">pip install -e ".[dev]"</text>
  <text x="422"  y="163" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">pytest to confirm.</text>

  <!-- Arrow 3→4 -->
  <line x1="496" y1="122" x2="518" y2="122" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Step 4: Write failing test -->
  <rect x="522" y="72" width="148" height="100" fill="#0d1510" rx="2"/>
  <rect x="522" y="72" width="148" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="522" y="100" width="148" height="12" fill="#0a1a0d"/>
  <line x1="522" y1="72" x2="522"  y2="172" stroke="#00ff88" stroke-width="1.5" opacity="0.35"/>
  <text x="596"  y="91"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">WRITE FAILING TEST</text>
  <text x="596"  y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"  fill="#00ff88" text-anchor="middle" letter-spacing="0.8">test first, always</text>
  <text x="596"  y="129" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">pytest must fail</text>
  <text x="596"  y="146" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">before you write</text>
  <text x="596"  y="163" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">implementation.</text>

  <!-- Wrap arrow: down from step 4 corner, along bottom, up to step 5 -->
  <!-- down from step 4 right edge -->
  <line x1="670" y1="122" x2="700" y2="122" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
  <line x1="700" y1="122" x2="700" y2="196" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  <line x1="700" y1="196" x2="440" y2="196" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>
  <line x1="440" y1="196" x2="440" y2="218" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.5"/>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- ROW 2 — steps 5–8 (bottom row)                       -->
  <!-- ══════════════════════════════════════════════════════ -->

  <!-- Step 5: Implement fix -->
  <rect x="338" y="222" width="146" height="100" fill="#0d1510" rx="2"/>
  <rect x="338" y="222" width="146" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="338" y="250" width="146" height="12"  fill="#0a1a0d"/>
  <line x1="338" y1="222" x2="338"  y2="322" stroke="#00ff88" stroke-width="1.5" opacity="0.35"/>
  <text x="411"  y="241"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">IMPLEMENT FIX</text>
  <text x="411"  y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"  fill="#00ff88" text-anchor="middle" letter-spacing="0.8">one change at a time</text>
  <text x="411"  y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Make it pass.</text>
  <text x="411"  y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Keep the scope</text>
  <text x="411"  y="313" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">to the issue.</text>

  <!-- Arrow 5→6 (left along row 2) -->
  <line x1="484" y1="272" x2="508" y2="272" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Step 6: pytest passes -->
  <rect x="512" y="222" width="130" height="100" fill="#0d1510" rx="2"/>
  <rect x="512" y="222" width="130" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="512" y="250" width="130" height="12"  fill="#0a1a0d"/>
  <line x1="512" y1="222" x2="512"  y2="322" stroke="#00ff88" stroke-width="1.5" opacity="0.35"/>
  <text x="577"  y="241"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">PYTEST PASSES</text>
  <text x="577"  y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"  fill="#00ff88" text-anchor="middle" letter-spacing="0.8">full suite</text>
  <text x="577"  y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Run all tests,</text>
  <text x="577"  y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">not just the</text>
  <text x="577"  y="313" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">new one.</text>

  <!-- Arrow 6→7 -->
  <line x1="642" y1="272" x2="666" y2="272" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Step 7: Open PR -->
  <rect x="670" y="222" width="130" height="100" fill="#0d1510" rx="2"/>
  <rect x="670" y="222" width="130" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="670" y="250" width="130" height="12"  fill="#0a1a0d"/>
  <line x1="670" y1="222" x2="670"  y2="322" stroke="#00ff88" stroke-width="1.5" opacity="0.35"/>
  <text x="735"  y="241"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">OPEN PR</text>
  <text x="735"  y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"  fill="#00ff88" text-anchor="middle" letter-spacing="0.8">link the issue</text>
  <text x="735"  y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Reference the</text>
  <text x="735"  y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">issue #. Use</text>
  <text x="735"  y="313" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">the template.</text>

  <!-- Arrow 7→8 -->
  <line x1="800" y1="272" x2="824" y2="272" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- Step 8: Merged -->
  <rect x="828" y="222" width="108" height="100" fill="#0d1510" rx="2"/>
  <rect x="828" y="222" width="108" height="40"  fill="#0a1a0d" rx="2"/>
  <rect x="828" y="250" width="108" height="12"  fill="#0a1a0d"/>
  <line x1="828" y1="222" x2="828"  y2="322" stroke="#00ff88" stroke-width="1.5" opacity="0.35"/>
  <text x="882"  y="241"  font-family="'Helvetica Neue', Arial, sans-serif" font-size="9"  font-weight="700" fill="#00ff88" text-anchor="middle" letter-spacing="1.5">MERGED</text>
  <text x="882"  y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8"  fill="#00ff88" text-anchor="middle" letter-spacing="0.8">review → main</text>
  <text x="882"  y="279" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">Reviewer feedback,</text>
  <text x="882"  y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">address, approve,</text>
  <text x="882"  y="313" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#aaaaaa" text-anchor="middle">merge to main.</text>

  <!-- Bottom tip bar -->
  <line x1="24" y1="334" x2="936" y2="334" stroke="#00ff88" stroke-width="0.4" opacity="0.3"/>
  <rect x="24" y="338" width="912" height="16" fill="#0d1510" rx="2"/>
  <line x1="24" y1="338" x2="24"  y2="354" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
  <text x="36" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" fill="#00ff88" letter-spacing="2">RULE:</text>
  <text x="70" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#aaaaaa">File the GitHub Issue before writing a single line. A fix with no issue number never happened. Dev env uses PostgreSQL via Docker — no SQLite.</text>
</svg>
