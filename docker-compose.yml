# Chainguard images: free tier requires :latest tag only.
# Version-pinned tags require a paid subscription.
# See: https://edu.chainguard.dev/chainguard/chainguard-images/faq/

services:
  # Three required services: postgres, ollama, engram
  # For GPU support, use: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
  # For host Ollama: docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up -d

  postgres:
    container_name: engram-postgres
    image: cgr.dev/chainguard/postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=engram
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-engram}
      - POSTGRES_DB=engram
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "engram"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    container_name: engram-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Initialize Ollama with nomic-embed-text model (required for vector embeddings).
  # Run once: docker compose --profile init run --rm ollama-init
  ollama-init:
    container_name: engram-ollama-init
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: /bin/sh
    command: -c "ollama pull nomic-embed-text && echo 'Model nomic-embed-text ready'"
    depends_on:
      ollama:
        condition: service_healthy
    profiles: ["init"]
    restart: no

  engram:
    container_name: engram-app
    build: .
    ports:
      - "${ENGRAM_PORT:-8788}:8788"
    environment:
      - ENGRAM_API_KEY=${ENGRAM_API_KEY:-}
      - ENGRAM_EMBEDDER=ollama
      - OLLAMA_URL=http://open-webui:8080/ollama
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - DATABASE_URL=postgresql://engram:${POSTGRES_PASSWORD:-engram}@postgres:5432/engram
    depends_on:
      postgres:
        condition: service_healthy
      open-webui:
        condition: service_started
    restart: unless-stopped


  # Open WebUI: auth proxy for Ollama access. Engram routes embedding
  # requests through Open-WebUI with Bearer token authentication.
  # First boot: visit http://localhost:3000, create admin, generate API key.
  open-webui:
    container_name: engram-open-webui
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=user
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # Optional: TLS termination for production SSE deployments.
  # Uncomment and configure Caddyfile with your domain.
  # caddy:
  #   container_name: engram-caddy
  #   image: cgr.dev/chainguard/caddy:latest
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     - engram
  #   restart: unless-stopped

  test-postgres:
    container_name: engram-test-postgres
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      - POSTGRES_DB=engram_test
      - POSTGRES_USER=engram
      - POSTGRES_PASSWORD=test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "engram"]
      interval: 3s
      timeout: 2s
      retries: 5

volumes:
  pgdata:
  ollama-data:
  open-webui-data:
  # caddy-data:
