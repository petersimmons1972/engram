# Chainguard images: free tier requires :latest tag only.
# Version-pinned tags require a paid subscription.
# See: https://edu.chainguard.dev/chainguard/chainguard-images/faq/
#
# Two-service architecture: PostgreSQL + Engram.
# Ollama is external — provided by your existing Open-WebUI installation.
# Set OLLAMA_URL and OLLAMA_API_KEY in .env to point at your OWUI instance.

services:

  postgres:
    container_name: engram-postgres
    image: cgr.dev/chainguard/postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=engram
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-engram}
      - POSTGRES_DB=engram
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "engram"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  engram:
    container_name: engram-app
    build: .
    ports:
      - "127.0.0.1:${ENGRAM_PORT:-8788}:8788"
    environment:
      - ENGRAM_API_KEY=${ENGRAM_API_KEY:-}
      - ENGRAM_EMBEDDER=ollama
      - OLLAMA_URL=${OLLAMA_URL:-https://open-webui.petersimmons.com/ollama}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - DATABASE_URL=postgresql://engram:${POSTGRES_PASSWORD:-engram}@postgres:5432/engram
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


  # Optional: TLS termination for production SSE deployments.
  # Uncomment and configure Caddyfile with your domain.
  # caddy:
  #   container_name: engram-caddy
  #   image: cgr.dev/chainguard/caddy:latest
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     - engram
  #   restart: unless-stopped

  test-postgres:
    container_name: engram-test-postgres
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      - POSTGRES_DB=engram_test
      - POSTGRES_USER=engram
      - POSTGRES_PASSWORD=test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "engram"]
      interval: 3s
      timeout: 2s
      retries: 5

volumes:
  pgdata:
  # caddy-data:
