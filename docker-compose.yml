# Chainguard images: free tier requires :latest tag only.
# Version-pinned tags require a paid subscription.
# See: https://edu.chainguard.dev/chainguard/chainguard-images/faq/

services:
  # Optional: Uncomment to run Ollama in Docker. By default, this assumes Ollama
  # is running on the host at localhost:11434 (systemd or native binary).
  # To use the Docker Ollama service instead:
  # 1. Comment out OLLAMA_URL in the engram service environment
  # 2. Uncomment the ollama service below
  # 3. Update engram depends_on to include ollama
  # 4. Set OLLAMA_URL=http://ollama:11434 in engram environment
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  engram:
    build: .
    ports:
      - "${ENGRAM_PORT:-8788}:8788"
    environment:
      - ENGRAM_API_KEY=${ENGRAM_API_KEY:-}
      - ENGRAM_EMBEDDER=ollama
      - OLLAMA_URL=http://localhost:11434
      - DATABASE_URL=postgresql://engram:${POSTGRES_PASSWORD:-engram}@postgres:5432/engram
    depends_on:
      postgres:
        condition: service_healthy
    # Note: OLLAMA_URL=http://localhost:11434 assumes Ollama is running on the host.
    # To use Docker Ollama instead, uncomment the ollama service above, set
    # OLLAMA_URL=http://ollama:11434, and add ollama to depends_on below.
    restart: unless-stopped

  postgres:
    image: cgr.dev/chainguard/postgres:latest
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=engram
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-engram}
      - POSTGRES_DB=engram
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "engram"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped


  # Optional: Open WebUI for browsing Ollama models and testing embeddings.
  # Useful for development/debugging, not required for Engram operation.
  # Start with: docker compose --profile ui up -d
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
    volumes:
      - open-webui-data:/app/backend/data
    profiles: ["ui"]
    restart: unless-stopped

  # Optional: TLS termination for production SSE deployments.
  # Uncomment and configure Caddyfile with your domain.
  # caddy:
  #   image: cgr.dev/chainguard/caddy:latest
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     - engram
  #   restart: unless-stopped

  test-postgres:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      - POSTGRES_DB=engram_test
      - POSTGRES_USER=engram
      - POSTGRES_PASSWORD=test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "engram"]
      interval: 3s
      timeout: 2s
      retries: 5

volumes:
  pgdata:
  ollama-data:
  open-webui-data:
  # caddy-data:
